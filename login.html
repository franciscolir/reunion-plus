<body class="bg-background font-body-md text-on-surface min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md text-center">
    <div class="w-20 h-20 rounded-2xl bg-primary text-on-primary flex items-center justify-center mx-auto mb-6 shadow-lg">
      <span class="material-symbols-outlined text-5xl">auto_stories</span>
    </div>
    <h1 class="font-display-lg text-display-lg text-primary mb-3">Bienvenido a Reunión+</h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto mb-8">
      Organiza el programa mensual de las reuniones de la congregación: asignaciones,
      reuniones de entre semana, atención y salidas, todo en un solo lugar.
    </p>

    <div id="loginGate" class="mb-3">
      <button id="loginStart" class="flex items-center gap-2 bg-primary text-on-primary px-8 py-3.5 rounded-xl font-label-lg text-label-lg hover:opacity-90 hover:shadow-lg transition-all active:scale-95 mx-auto">
        <span class="material-symbols-outlined text-[22px]">login</span>
        Entrar
      </button>
    </div>

    <form id="loginForm" class="hidden bg-surface-container-lowest rounded-xl border border-outline-variant p-6 text-left space-y-4 shadow-sm">
      <div>
        <label for="loginEmail" class="block font-label-md text-label-md text-on-surface-variant mb-1">Correo electrónico</label>
        <input id="loginEmail" type="email" required placeholder="usuario@ejemplo.com" autocomplete="email" class="w-full bg-surface-bright border border-outline-variant rounded-lg p-2.5 font-body-md focus:border-primary">
      </div>
      <div>
        <label for="loginPass" class="block font-label-md text-label-md text-on-surface-variant mb-1">Contraseña</label>
        <input id="loginPass" type="password" required placeholder="••••••••" autocomplete="current-password" class="w-full bg-surface-bright border border-outline-variant rounded-lg p-2.5 font-body-md focus:border-primary">
      </div>
      <p id="loginError" class="hidden text-error font-label-md text-label-md"></p>
      <div class="flex gap-3 justify-end pt-1">
        <button type="button" id="loginCancel" class="px-5 py-2.5 rounded-lg border border-outline font-label-md text-label-md hover:bg-surface-container">Volver</button>
        <button type="submit" id="loginSubmit" class="px-5 py-2.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90">Entrar</button>
      </div>
    </form>

    <p class="text-on-surface-variant text-sm mt-4">Acceso restringido a los correos autorizados por la congregación.</p>
  </main>

  <script type="module" src="./login.js?v=269"></script>
