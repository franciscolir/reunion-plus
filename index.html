<body class="bg-surface font-body-md text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">

  <!-- TopAppBar -->
  <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface border-b border-outline-variant">
    <div class="flex items-center gap-3">
      <button id="navToggle" class="lg:hidden material-symbols-outlined p-2 text-on-surface-variant hover:text-primary">menu</button>
      <span class="font-headline-md text-headline-md font-bold text-primary" id="topTitle">Reunión+</span>
      <span id="topBadge" class="hidden px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md"></span>
    </div>
    <div class="flex items-center gap-2">
      <div id="syncSaveWrap" data-admin class="flex items-center gap-1" title="Estado de la sincronización con Firebase">
        <button id="onlineBtn" class="material-symbols-outlined p-2 text-on-surface-variant hover:text-primary" title="Guardar cambios en Supabase">cloud</button>
        <span id="syncSaveLabel" class="hidden items-center gap-1 px-2.5 py-1.5 rounded-full bg-error-container text-on-error-container font-label-md text-label-md cursor-pointer hover:opacity-90" title="Hay cambios sin guardar en Supabase. Pulsa para subirlos.">
          <span class="material-symbols-outlined text-[16px]">upload</span>
          Guardar cambios
        </span>
      </div>
      <button id="authBtn" class="flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-on-surface-variant hover:bg-surface-variant hover:text-primary font-label-md text-label-md" title="Iniciar sesión" style="display:none">
        <span class="material-symbols-outlined text-[18px]">account_circle</span>
        <span id="authBtnLabel">Entrar</span>
      </button>
      <button id="settingsBtn" class="material-symbols-outlined p-2 text-on-surface-variant hover:text-primary" title="Ajustes">settings</button>
    </div>
  </header>

  <!-- SideNav -->
  <aside id="sideNav" class="fixed left-0 top-16 h-[calc(100vh-4rem)] w-64 bg-surface-container-low border-r border-outline-variant hidden lg:flex flex-col p-4 gap-2 z-40 transition-transform">
    <div class="mb-4">
      <h2 class="font-headline-md text-headline-md text-primary">Reunión+</h2>
      <p class="text-on-surface-variant font-label-md text-label-md">Planificador Mensual</p>
      <p id="sideAuthBadge" class="hidden text-[11px] font-label-md mt-1"></p>
    </div>
    <nav class="flex flex-col gap-1 flex-1" id="sideNavItems"></nav>
    <div class="pt-4 border-t border-outline-variant flex flex-col gap-1">
      <button id="sideNewMonth" class="w-full bg-primary text-on-primary py-3 rounded-lg font-bold hover:opacity-90 active:scale-95 transition-all">
        Nuevo Programa
      </button>
      <button id="sideAbout" class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:text-primary transition-all">
        <span class="material-symbols-outlined">help</span>
        <span class="font-label-md text-label-md">Ayuda</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="lg:ml-64 pt-20 px-margin-mobile md:px-margin-desktop pb-24 max-w-container-max-width mx-auto" id="app"></main>

  <!-- Modal contendores dinámicos -->
  <div id="modalRoot" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4">
    <div id="modalBackdrop" class="absolute inset-0 bg-black/40"></div>
    <div id="modalCard" class="relative bg-surface-container-lowest rounded-xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6"></div>
  </div>

  <!-- Toast -->
  <div id="toastRoot" class="fixed bottom-6 right-6 z-[80] flex flex-col gap-2"></div>

  <!-- Footer móvil action bar (reutilizable) -->
  <div id="actionBar" class="hidden fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant px-margin-desktop py-3 z-50"></div>

  <script src="./vendor/pdfjs/pdf.min.js"></script>
  <script type="module" src="./app.js?v=210"></script>
</body>
</html>
